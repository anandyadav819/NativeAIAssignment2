version: '3.8'

services:
  # ============================================
  # INFRASTRUCTURE SERVICES
  # ============================================
  
  postgres:
    image: postgres:15-alpine
    container_name: fooddelivery-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 23rc8efwmed932d@$c83
      POSTGRES_DB: fooddelivery
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fooddelivery-network

  redis:
    image: redis:7-alpine
    container_name: fooddelivery-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - fooddelivery-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: fooddelivery-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fooddelivery-network

  # ============================================
  # APPLICATION SERVICES
  # ============================================

  order-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.order
    container_name: fooddelivery-order-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__FoodDeliveryDb=Host=postgres;Port=5432;Database=fooddelivery;Username=postgres;Password=23rc8efwmed932d@$c83
      - Redis__ConnectionString=redis:6379
      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
    ports:
      - "5075:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fooddelivery-network
    restart: unless-stopped

  menu-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.menu
    container_name: fooddelivery-menu-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__FoodDeliveryDb=Host=postgres;Port=5432;Database=fooddelivery;Username=postgres;Password=23rc8efwmed932d@$c83
      - Redis__ConnectionString=redis:6379
    ports:
      - "5284:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fooddelivery-network
    restart: unless-stopped

  tracking-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.tracking
    container_name: fooddelivery-tracking-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__FoodDeliveryDb=Host=postgres;Port=5432;Database=fooddelivery;Username=postgres;Password=23rc8efwmed932d@$c83
      - Redis__ConnectionString=redis:6379
      - Cors__AllowedOrigins__0=http://localhost:3000
      - Cors__AllowedOrigins__1=http://localhost:5173
    ports:
      - "5173:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fooddelivery-network
    restart: unless-stopped

# ============================================
# VOLUMES
# ============================================

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local

# ============================================
# NETWORKS
# ============================================

networks:
  fooddelivery-network:
    driver: bridge
